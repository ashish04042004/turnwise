name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnwise
          POSTGRES_PASSWORD: turnwise
          POSTGRES_DB: turnwise
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U turnwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://turnwise:turnwise@localhost:5433/turnwise
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
      - run: npm test
      - name: Concurrency load test (fails on any double booking)
        run: npm run loadtest -- --clients 30 --attempts 200 --slots 10 --walkins 30
      - run: npm run build
      - name: Browser smoke test (sign in, walk-in, start, complete)
        run: |
          npm run seed
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t turnwise-app .
