# Render Blueprint: a free, single-service deployment of the synthetic demo.
# Dashboard → New → Blueprint → pick this repository.
#
# Free-tier trade-offs: the web service sleeps after ~15 idle minutes (the
# first request then takes about a minute), the free Postgres expires after
# 30 days, and the free Key Value store is not persisted. Everything is
# synthetic and regenerated on start, so none of that loses anything real.

services:
  - type: web
    name: turnwise
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: turnwise-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: turnwise-kv
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # One free service: the BullMQ worker runs inside the API process.
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"
      # Seed on first start, and again whenever the synthetic day is over.
      - key: DEMO_AUTO_REFRESH
        value: "true"
      - key: ENABLE_SIMULATOR
        value: "true"
      - key: TRUST_PROXY
        value: "1"

  - type: keyvalue
    name: turnwise-kv
    plan: free
    region: singapore
    # BullMQ needs keys to stay until they expire or are removed.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: turnwise-db
    plan: free
    region: singapore
    databaseName: turnwise
    user: turnwise
    # Reachable only from services in this Render account.
    ipAllowList: []
