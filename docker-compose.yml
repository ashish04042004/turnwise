services:
  postgres:
    image: postgres:16-alpine
    container_name: turnwise-postgres
    environment:
      POSTGRES_USER: turnwise
      POSTGRES_PASSWORD: turnwise
      POSTGRES_DB: turnwise
    ports:
      - "5433:5432"
    volumes:
      - turnwise-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnwise"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: turnwise-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Full stack: `docker compose --profile app up --build` (http://localhost:8080, or set TURNWISE_PORT).
  migrate:
    profiles: [app]
    image: turnwise-app
    build: .
    command: ["node", "server/src/migrate.js"]
    healthcheck:
      disable: true
    environment: &app-env
      DATABASE_URL: postgres://turnwise:turnwise@postgres:5432/turnwise
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-insecure-demo-secret-change-me}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-true}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    image: turnwise-app
    environment: *app-env
    ports:
      - "${TURNWISE_PORT:-8080}:4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: [app]
    image: turnwise-app
    command: ["node", "server/src/worker.js"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  turnwise-pg:
