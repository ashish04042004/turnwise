services:
  postgres:
    image: postgres:16-alpine
    container_name: turnwise-postgres
    environment:
      POSTGRES_USER: turnwise
      POSTGRES_PASSWORD: turnwise
      POSTGRES_DB: turnwise
    ports:
      - "5433:5432"
    volumes:
      - turnwise-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnwise"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: turnwise-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  turnwise-pg:
